# USB ROS2 相机配置文件
# 用于 yolo 的单路订阅版本，默认接左摄像头
# 相机格式/分辨率由 camera_stream/config/camera_stream.yaml 管理。
camera:
  source: ros
  topic: /cam_left/image_raw
  camera_name: cam_left
  width: 1280
  height: 720
  fps: 30

# 相机内参 (标定后填入)
intrinsics:
  fx: 600.0
  fy: 600.0
  cx: 640.0
  cy: 360.0

# 坐标变换 (相机→机器人, 参照 K4AConfig.yaml)
transform:
  rotation:
    - [0.2273, 0.3271, 0.9172]
    - [0.0787, -0.9450, 0.3175]
    - [0.9706, 0.0, -0.2406]
  translation: [0.32217, -0.33466, 0.62044]
