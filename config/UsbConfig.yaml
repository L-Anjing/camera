# USB 相机配置文件
camera:
  width: 640
  height: 480
  fps: 30
  device_id: 0   # /dev/video0

# 相机内参 (标定后填入)
intrinsics:
  fx: 600.0
  fy: 600.0
  cx: 320.0
  cy: 240.0

# 坐标变换 (相机→机器人, 参照 K4AConfig.yaml)
transform:
  rotation:
    - [0.2273, 0.3271, 0.9172]
    - [0.0787, -0.9450, 0.3175]
    - [0.9706, 0.0, -0.2406]
  translation: [0.32217, -0.33466, 0.62044]
